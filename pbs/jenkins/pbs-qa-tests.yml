- job:
    name: pbs-qa-tests
    project-type: pipeline
    description: |
        Runs the server-qa test_scripts/pbs/ percona-binlog-server tests (pbs_test_runner.py) on EC2 via molecule.
        Do not edit this job through the web!
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - 'master'
            wipe-workspace: true
      lightweight-checkout: true
      script-path: pbs/jenkins/pbs-qa-tests.groovy
