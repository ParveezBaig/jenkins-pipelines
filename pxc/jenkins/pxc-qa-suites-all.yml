- job:
    name: pxc-qa-suites-all
    project-type: pipeline
    description: |
        Runs five pxc-qa-suites builds in parallel: upgrade (encryption), replication,
        correctness/galera_sr/ssl (workers), random_qa (encryption, workers) and
        loadtest (encryption).
        A failed run marks this build UNSTABLE; the others keep running.
        Do not edit this job through the web!
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - 'master'
            wipe-workspace: true
      lightweight-checkout: true
      script-path: pxc/jenkins/pxc-qa-suites-all.groovy
